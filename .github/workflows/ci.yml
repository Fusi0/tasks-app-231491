name: Test and Scan

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Run Python
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: List repository files
        run: ls -la