name: Test and Scan

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Run Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: List repository files
        run: ls -la

      - name: Install dependencies
        run: |
          python -m pip install -r services/title-normalizer/requirements.txt
          python -m pip install -r services/tasks-api/requirements.txt

      - name: Test tasks-api
        run: python -m pytest -c services/tasks-api/pytest.ini services/tasks-api/tests/

      - name: Test title-normalizer
        run: python -m pytest -c services/title-normalizer/pytest.ini services/title-normalizer/tests/